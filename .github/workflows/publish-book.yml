on:
  push:
    branches:
      - "**"
    paths:
      - "rse-book/**"
      - "year-books/**"
      - "scripts/build-year-book.R"
      - "RSE_survey_insights_helper/**"
      - ".github/workflows/publish-book.yml"
  workflow_dispatch:

name: Build and publish survey books

jobs:
  build:
    name: Build ${{ matrix.year }} book
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        year: ["2016", "2017", "2018", "2022", "2026"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out ${{ matrix.year }} survey data
        uses: actions/checkout@v4
        with:
          repository: softwaresaved/RSE_survey_longitudinal
          ref: main
          path: RSE_survey_longitudinal
          sparse-checkout: ${{ matrix.year }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::dplyr
            any::forcats
            any::ggplot2
            any::gt
            any::knitr
            any::patchwork
            any::purrr
            any::scales
            any::stringr
            any::tidyr

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Generate and render year book
        env:
          SURVEY_YEAR: ${{ matrix.year }}
        run: |
          if [ "$SURVEY_YEAR" = "2026" ]; then
            mkdir -p RSE_survey_2026_data
            cp RSE_survey_longitudinal/2026/2026_tf.csv RSE_survey_2026_data/2026_tf.csv
            cp RSE_survey_longitudinal/2026/2026_cols.csv RSE_survey_2026_data/2026_cols.csv
            quarto render rse-book --execute
            mkdir -p .generated/site/2026
            cp -R rse-book/_book/. .generated/site/2026/
          else
            Rscript scripts/build-year-book.R "$SURVEY_YEAR" RSE_survey_longitudinal .generated/year-books
            quarto render ".generated/year-books/$SURVEY_YEAR"
            mkdir -p ".generated/site/$SURVEY_YEAR"
            cp -R ".generated/year-books/$SURVEY_YEAR/_book/." ".generated/site/$SURVEY_YEAR/"
          fi

      - name: Upload rendered book
        uses: actions/upload-artifact@v4
        with:
          name: book-${{ matrix.year }}
          path: .generated/site
          if-no-files-found: error

  deploy:
    name: Publish survey books
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render multi-year landing page
        run: quarto render year-books

      - name: Download rendered books
        uses: actions/download-artifact@v4
        with:
          pattern: book-*
          path: year-books/_site
          merge-multiple: true

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: year-books
          render: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
